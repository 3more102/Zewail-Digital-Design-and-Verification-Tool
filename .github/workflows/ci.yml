name: ZDDV CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Unit tests
        run: pytest tests/test_config.py tests/test_regression.py tests/test_storage.py -q

  verilator-integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Environment check
        run: zddv doctor

      - name: Build counter example
        run: zddv --project examples/counter build

      - name: Run counter example
        run: zddv --project examples/counter run

      - name: Run seeded regression
        run: zddv --project examples/counter regress examples/counter/regression.toml

      - name: Show run database
        run: zddv --project examples/counter runs --limit 10

      - name: Merge coverage
        run: zddv --project examples/counter coverage

      - name: Integration tests
        run: pytest tests/test_verilator_integration.py -q
