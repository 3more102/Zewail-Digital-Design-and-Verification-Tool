name: ZDDV CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Unit tests
        run: pytest -q

  verilator-integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Environment check
        run: zddv doctor

      - name: Lint counter example
        run: zddv --project examples/counter lint

      - name: Build design index and hierarchy
        run: |
          zddv --project examples/counter index
          test -s examples/counter/.zddv/design/index.json
          zddv --project examples/counter hierarchy | tee /tmp/zddv-hierarchy.txt
          grep -q "tb_counter: tb_counter" /tmp/zddv-hierarchy.txt
          grep -q "dut: counter" /tmp/zddv-hierarchy.txt

      - name: Build and query connectivity index
        run: |
          zddv --project examples/counter connectivity
          test -s examples/counter/.zddv/design/connectivity.json
          zddv --project examples/counter connectivity count --unit counter | tee /tmp/zddv-count-connectivity.txt
          grep -q "DRIVER \[procedural_assignment\]" /tmp/zddv-count-connectivity.txt
          zddv --project examples/counter connectivity count --unit tb_counter | tee /tmp/zddv-tb-connectivity.txt
          grep -q "DRIVER \[instance_port\]" /tmp/zddv-tb-connectivity.txt

      - name: Build counter example
        run: zddv --project examples/counter build

      - name: Run counter example
        run: zddv --project examples/counter run

      - name: Index latest waveform
        run: |
          zddv --project examples/counter waveform-index
          test -s examples/counter/.zddv/waveforms/latest.json
          grep -q '"format": "vcd"' examples/counter/.zddv/waveforms/latest.json
          grep -q '"parse_status": "indexed"' examples/counter/.zddv/waveforms/latest.json

      - name: Probe latest VCD waveform values
        run: |
          SIGNAL=$(python -c 'import json; print(json.load(open("examples/counter/.zddv/waveforms/latest.json"))["signals"][0]["path"])')
          zddv --project examples/counter waveform-probe "$SIGNAL" --max-changes 5
          test -s examples/counter/.zddv/waveforms/probes/latest.json
          grep -q '"total_changes":' examples/counter/.zddv/waveforms/probes/latest.json

      - name: Correlate assertion to waveform
        run: |
          zddv --project examples/counter assertion-waveform --status PASS --limit 10
          test -s examples/counter/.zddv/debug/assertion-waveform.json
          grep -q '"with_indexed_waveform": 1' examples/counter/.zddv/debug/assertion-waveform.json
          grep -q '"format": "vcd"' examples/counter/.zddv/debug/assertion-waveform.json

      - name: Cross-probe waveform signal
        run: |
          zddv --project examples/counter crossprobe tb_counter.dut.count
          test -s examples/counter/.zddv/debug/crossprobe.json
          grep -q '"status": "MATCHED"' examples/counter/.zddv/debug/crossprobe.json
          grep -q '"file": "rtl/counter.sv"' examples/counter/.zddv/debug/crossprobe.json
          grep -q '"analysis_level": "source_structural"' examples/counter/.zddv/debug/crossprobe.json

      - name: Run seeded regression
        run: zddv --project examples/counter regress examples/counter/regression.toml

      - name: Show run database
        run: zddv --project examples/counter runs --limit 10

      - name: Show assertion database
        run: |
          zddv --project examples/counter assertions --limit 20
          zddv --project examples/counter assertions --status PASS --limit 20 | grep -q counter_sequence

      - name: Import functional coverage
        run: |
          zddv --project examples/counter fcov-import functional_coverage.json
          zddv --project examples/counter fcov-history --limit 10 | grep -q counter-example
          zddv --project examples/counter fcov-holes --limit 10 | grep -q wraparound

      - name: Analyze APB trace
        run: |
          zddv --project examples/counter apb-analyze ../apb_trace.json
          test -s examples/counter/.zddv/protocols/apb/latest.json
          grep -q '"completed_transactions": 2' examples/counter/.zddv/protocols/apb/latest.json

      - name: Analyze AXI4-Lite trace
        run: |
          zddv --project examples/counter axi4lite-analyze ../axi4lite_trace.json
          test -s examples/counter/.zddv/protocols/axi4lite/latest.json
          grep -q '"completed_transactions": 2' examples/counter/.zddv/protocols/axi4lite/latest.json
          grep -q '"violations": 0' examples/counter/.zddv/protocols/axi4lite/latest.json

      - name: Analyze AXI4-Lite waveform
        run: |
          zddv --project examples/counter axi4lite-waveform --input ../axi4lite_waveform.vcd
          test -s examples/counter/.zddv/protocols/axi4lite/waveform-trace.json
          test -s examples/counter/.zddv/protocols/axi4lite/waveform-latest.json
          grep -q '"completed_transactions": 2' examples/counter/.zddv/protocols/axi4lite/waveform-latest.json
          grep -q '"scope": "tb.axi"' examples/counter/.zddv/protocols/axi4lite/waveform-latest.json
          grep -q '"response_time": 35' examples/counter/.zddv/protocols/axi4lite/waveform-latest.json

      - name: Analyze APB waveform
        run: |
          zddv --project examples/counter apb-waveform --input ../apb_waveform.vcd
          test -s examples/counter/.zddv/protocols/apb/waveform-trace.json
          test -s examples/counter/.zddv/protocols/apb/waveform-latest.json
          grep -q '"completed_transactions": 2' examples/counter/.zddv/protocols/apb/waveform-latest.json
          grep -q '"scope": "tb.apb"' examples/counter/.zddv/protocols/apb/waveform-latest.json
          grep -q '"end_time": 25' examples/counter/.zddv/protocols/apb/waveform-latest.json

      - name: Analyze AXI4 burst trace
        run: |
          zddv --project examples/counter axi4-analyze ../axi4_trace.json
          test -s examples/counter/.zddv/protocols/axi4/latest.json
          grep -q '"protocol": "AXI4"' examples/counter/.zddv/protocols/axi4/latest.json
          grep -q '"completed_transactions": 2' examples/counter/.zddv/protocols/axi4/latest.json
          grep -q '"violations": 0' examples/counter/.zddv/protocols/axi4/latest.json

      - name: Analyze AXI4 request sidebands
        run: |
          zddv --project examples/counter axi4-analyze ../axi4_sideband_trace.json --output .zddv/protocols/axi4/sidebands.json
          test -s examples/counter/.zddv/protocols/axi4/sidebands.json
          grep -q '"arcache": 15' examples/counter/.zddv/protocols/axi4/sidebands.json
          grep -q '"arprot": 5' examples/counter/.zddv/protocols/axi4/sidebands.json
          grep -q '"arqos": 10' examples/counter/.zddv/protocols/axi4/sidebands.json
          grep -q '"arregion": 3' examples/counter/.zddv/protocols/axi4/sidebands.json
          grep -q '"awcache": 7' examples/counter/.zddv/protocols/axi4/sidebands.json
          grep -q '"awprot": 2' examples/counter/.zddv/protocols/axi4/sidebands.json
          grep -q '"awqos": 9' examples/counter/.zddv/protocols/axi4/sidebands.json
          grep -q '"awregion": 4' examples/counter/.zddv/protocols/axi4/sidebands.json
          grep -q '"violations": 0' examples/counter/.zddv/protocols/axi4/sidebands.json

      - name: Analyze AXI4 USER sidebands
        run: |
          zddv --project examples/counter axi4-analyze ../axi4_user_trace.json --output .zddv/protocols/axi4/user.json
          test -s examples/counter/.zddv/protocols/axi4/user.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("examples/counter/.zddv/protocols/axi4/user.json").read_text())
          write = next(tx for tx in payload["transactions"] if tx["direction"] == "WRITE")
          read = next(tx for tx in payload["transactions"] if tx["direction"] == "READ")
          assert (write["awuser"], write["wuser"], write["buser"]) == (10, [3], 5)
          assert (read["aruser"], read["ruser"]) == (11, [18])
          assert payload["summary"]["violations"] == 0
          PY

      - name: Analyze AXI4 write strobe lanes
        run: |
          zddv --project examples/counter axi4-analyze ../axi4_wstrb_trace.json --output .zddv/protocols/axi4/wstrb.json
          test -s examples/counter/.zddv/protocols/axi4/wstrb.json
          grep -q '"data_width_bits": 32' examples/counter/.zddv/protocols/axi4/wstrb.json
          grep -q '"write_strobe_allowed_masks"' examples/counter/.zddv/protocols/axi4/wstrb.json
          grep -q '"violations": 0' examples/counter/.zddv/protocols/axi4/wstrb.json

      - name: Analyze AXI4 exclusive trace
        run: |
          zddv --project examples/counter axi4-analyze ../axi4_exclusive_trace.json --output .zddv/protocols/axi4/exclusive.json
          test -s examples/counter/.zddv/protocols/axi4/exclusive.json
          grep -q '"exclusive_reads": 1' examples/counter/.zddv/protocols/axi4/exclusive.json
          grep -q '"exclusive_writes": 1' examples/counter/.zddv/protocols/axi4/exclusive.json
          grep -q '"matched_exclusive_writes": 1' examples/counter/.zddv/protocols/axi4/exclusive.json
          grep -q '"violations": 0' examples/counter/.zddv/protocols/axi4/exclusive.json

      - name: Analyze AXI4 burst waveform
        run: |
          zddv --project examples/counter axi4-waveform --input ../axi4_waveform.vcd
          test -s examples/counter/.zddv/protocols/axi4/waveform-trace.json
          test -s examples/counter/.zddv/protocols/axi4/waveform-latest.json
          grep -q '"completed_transactions": 2' examples/counter/.zddv/protocols/axi4/waveform-latest.json
          grep -q '"scope": "tb.axi"' examples/counter/.zddv/protocols/axi4/waveform-latest.json
          grep -q '"response_time": 65' examples/counter/.zddv/protocols/axi4/waveform-latest.json
          grep -q '"awuser": 10' examples/counter/.zddv/protocols/axi4/waveform-latest.json
          grep -q '"buser": 3' examples/counter/.zddv/protocols/axi4/waveform-latest.json
          grep -q '"aruser": 11' examples/counter/.zddv/protocols/axi4/waveform-latest.json

      - name: Analyze async FIFO CDC trace
        run: |
          zddv --project examples/counter async-fifo-analyze ../async_fifo_cdc_trace.json
          test -s examples/counter/.zddv/cdc/async-fifo/latest.json
          grep -q '"analysis": "async_fifo_cdc_dynamic"' examples/counter/.zddv/cdc/async-fifo/latest.json
          grep -q '"violations": 0' examples/counter/.zddv/cdc/async-fifo/latest.json
          grep -q '"not_static_cdc_signoff": true' examples/counter/.zddv/cdc/async-fifo/latest.json

      - name: Analyze UCIe public FLIT trace
        run: |
          zddv --project examples/counter ucie-analyze ../ucie_trace.json
          test -s examples/counter/.zddv/protocols/ucie/latest.json
          grep -q '"protocol": "UCIe"' examples/counter/.zddv/protocols/ucie/latest.json
          grep -q '"health": "DEGRADED"' examples/counter/.zddv/protocols/ucie/latest.json
          grep -q '"flits": 3' examples/counter/.zddv/protocols/ucie/latest.json
          grep -q '"violations": 0' examples/counter/.zddv/protocols/ucie/latest.json

      - name: Analyze UVM report log
        run: |
          zddv --project examples/counter uvm-analyze ../uvm_report.log --source example-uvm
          test -s examples/counter/.zddv/uvm/latest.json
          grep -q '"analysis": "uvm_log"' examples/counter/.zddv/uvm/latest.json
          grep -q '"test_name": "zddv_uvm_smoke"' examples/counter/.zddv/uvm/latest.json
          grep -q '"count_source": "uvm_report_summary"' examples/counter/.zddv/uvm/latest.json
          grep -q '"warnings": 1' examples/counter/.zddv/uvm/latest.json
          grep -q '"errors": 0' examples/counter/.zddv/uvm/latest.json
          zddv --project examples/counter uvm-history --limit 5 | grep -q 'zddv_uvm_smoke'

      - name: Verify concurrent async FIFO RTL example
        run: |
          zddv --project examples/async_fifo lint
          zddv --project examples/async_fifo build
          zddv --project examples/async_fifo run --test async_fifo_smoke --seed 42 --timeout 20
          zddv --project examples/async_fifo regress examples/async_fifo/regression.toml
          zddv --project examples/async_fifo coverage
          test -s examples/async_fifo/.zddv/coverage/metrics.json
          zddv --project examples/async_fifo assertions --status PASS --limit 50 | grep -q async_fifo_ordering

      - name: Export JUnit results
        run: |
          zddv --project examples/counter junit --output .zddv/junit.xml --limit 10
          test -s examples/counter/.zddv/junit.xml

      - name: Exercise selective rerun command
        run: zddv --project examples/counter rerun --status FAIL --limit 10

      - name: Generate failure-group report
        run: |
          zddv --project examples/counter failures --limit 50
          test -s examples/counter/.zddv/failure-groups.json

      - name: Merge and ingest coverage
        run: |
          zddv --project examples/counter coverage
          test -s examples/counter/.zddv/coverage/metrics.json

      - name: Show coverage history
        run: zddv --project examples/counter coverage-history --limit 10

      - name: Report coverage holes
        run: |
          zddv --project examples/counter coverage-holes --show 10
          test -s examples/counter/.zddv/coverage/holes.json

      - name: Generate HTML dashboard
        run: |
          zddv --project examples/counter report --limit 50
          test -s examples/counter/.zddv/reports/latest.html
          grep -q "Coverage hit rate" examples/counter/.zddv/reports/latest.html

      - name: Integration tests
        run: pytest tests/test_verilator_integration.py -q
